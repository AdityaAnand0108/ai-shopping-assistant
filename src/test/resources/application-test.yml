# Activated via @ActiveProfiles("test"). Layers on top of application.yml
# rather than shadowing it, so shared settings stay in one place.
# Tests run fully in-memory and never touch Ollama or MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# Each test class owns its fixtures; no demo data is loaded automatically.
shopassist:
  seed:
    enabled: false

# Retrieval needs a live embedding model. Tests exercise the hybrid search path
# through a stub retriever instead, so the suite never depends on Ollama.
  rag:
    enabled: false
