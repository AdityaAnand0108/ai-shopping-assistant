# Default local profile: zero-install H2 running in MySQL compatibility mode,
# so the same Flyway migrations work unchanged against real MySQL.
# Hibernate detects the dialect from the connection; no need to set it.
spring:
  datasource:
    url: jdbc:h2:file:./data/shopdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
