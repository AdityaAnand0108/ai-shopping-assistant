spring:
  application:
    name: shop-assistant
  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  # A local model is far slower than a REST call. The default 60s read timeout
  # is not enough for a 7B model composing a few sentences on CPU.
  http:
    client:
      read-timeout: 180s
      connect-timeout: 10s

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopassist: DEBUG

# Application-specific settings (expanded in later phases)
shopassist:
  model:
    chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
    embedding-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    temperature: 0.1
  jwt:
    # Development default. Override with SHOPASSIST_JWT_SECRET anywhere real;
    # the application logs a warning while this value is in use.
    secret: ${SHOPASSIST_JWT_SECRET:dev-only-insecure-signing-key-replace-me-in-any-real-deployment}
    access-token-ttl: 60m
    issuer: shop-assistant
  seed:
    enabled: true
    products-csv: classpath:data/products.csv
    demo-password: Password123
  rag:
    enabled: true
    store-path: ./data/vector-store.json
    # Retrieval runs before the hard filters, so it must return enough
    # candidates that a price or stock filter still leaves results behind.
    top-k: 40
    # Measured, not guessed. With nomic-embed-text over short product
    # descriptions, cosine scores sit in a narrow band: a strong match reaches
    # about 0.60 and an unrelated item still scores about 0.45, so ranking in
    # the middle is close to arbitrary. Cutting at 0.55 keeps the confident head
    # of the ranking and discards the rest, which then falls through to keyword
    # search. Returning nothing is better than returning chinos for "tea and
    # coffee".
    similarity-threshold: 0.55
  guard:
    max-input-chars: 1000
    max-turns-in-context: 12
  guardrails:
    # Refuse plain instruction-override attempts before spending a model call.
    block-injection: true
    # Last line of defence against a reply naming a table, a column or a stack
    # frame. Everything upstream is built so it cannot happen; this catches the
    # one path that is not structural - the model writing prose of its own.
    scan-output: true
    # Compare each reply against what the tools actually returned, and flag
    # figures with no source. Flags rather than blocks: see GroundingCheck.
    check-grounding: true
    # A chat turn costs seconds of model time, so one client can starve the
    # machine without looking abusive. The catalog endpoints need no equivalent.
    messages-per-minute: 20
